apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      containers:
        - name: delivery-service
          image: thyaga/delivery-service:latest # Replace with your actual Docker Hub image
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DB_URI
              value: "mongodb+srv://thyaga:thyagaA12345@deliverycluster.cgj6ylo.mongodb.net/DeliveryManagement?retryWrites=true&w=majority"
